<h1 class="title">📚 Liste des livres</h1>

<div *ngIf="loading" class="loading">
  ⏳ Chargement des livres...
</div>

<div *ngIf="!loading && (isProf || isAdmin)" class="add-form-toggle">
  <button (click)="toggleAddForm()" class="btn-toggle">
    {{ showAddForm ? 'Fermer le formulaire' : 'Ajouter un livre' }}
  </button>

  <div *ngIf="showAddForm" class="add-form">
    <h3>Ajouter un livre</h3>

    <label>
      ISBN :
      <input [(ngModel)]="newIsbn" name="isbn" required />
    </label>

    <label>
      Titre :
      <input [(ngModel)]="newTitre" name="titre" required />
    </label>

    <label>
      Auteur :
      <input [(ngModel)]="newAuteur" name="auteur" required />
    </label>

    <label>
      Date de publication :
      <input type="date" [(ngModel)]="newDatePublication" name="date_publication" required />
    </label>

    <label>
      Éditeur :
      <input [(ngModel)]="newEditeur" name="editeur" required />
    </label>

    <label>
      Nombre de pages :
      <input type="number" [(ngModel)]="newNombrePages" name="nombre_pages" required min="1" />
    </label>

    <label>
      Exemplaires :
      <input type="number" [(ngModel)]="newExemplaires" name="exemplaires" min="1" />
    </label>

    <label>
      Langue :
      <input [(ngModel)]="newLangue" name="langue" placeholder="français" />
    </label>

    <label>
      Catégorie :
      <input [(ngModel)]="newCategorie" name="categorie" />
    </label>

    <label>
      Description :
      <br>
      <textarea [(ngModel)]="newDescription" name="description" rows="5" cols="68"></textarea>
    </label>

    <label>
      Couverture (URL) :
      <input [(ngModel)]="newCouverture" name="couverture" />
    </label>

    <div class="form-actions">
      <button (click)="addLivre()">Ajouter</button>
      <button type="button" (click)="toggleAddForm()">Annuler</button>
    </div>
  </div>
</div>

<div *ngIf="!loading" class="books-grid">
  <div class="book-card" *ngFor="let livre of livres">
    <div class="book-header">
      <h2>{{ livre.titre }}</h2>
      <span class="categorie">{{ livre.categorie || 'Non classé' }}</span>
    </div>

    <p class="auteur">✍️ {{ livre.auteur }}</p>

    <p class="details">
      <strong>📅 Publication :</strong> {{ livre.date_publication }}<br>
      <strong>📖 Pages :</strong> {{ livre.nombre_pages }}<br>
      <strong>📦 Exemplaires :</strong> {{ livre.exemplaires }}
    </p>

    <a class="btn-details" [routerLink]="['/livres', livre.id]">Voir détails</a>
    <br>
    <a *ngIf="isProf || isAdmin" class="btn-edit" [routerLink]="['/livres', livre.id, 'edit']">Modifier</a>
    <button *ngIf="isProf || isAdmin" class="btn-delete" (click)="deleteLivre(livre.id)">Supprimer</button>
  </div>
</div>
