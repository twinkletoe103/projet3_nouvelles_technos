<div class="edit-profile-container">
  <div class="edit-profile-card">
    <h2>Modifier mon compte</h2>

    <div class="alert alert-success" *ngIf="successMessage">
      ✓ {{ successMessage }}
    </div>

    <div class="alert alert-danger" *ngIf="errorMessage">
      ✗ {{ errorMessage }}
    </div>

    <form [formGroup]="editForm" (ngSubmit)="onSubmit()">

      <div class="form-group">
        <label for="name">Nom complet</label>
        <input
          type="text"
          id="name"
          formControlName="name"
          class="form-control"
          [class.is-invalid]="editForm.get('name')?.invalid && editForm.get('name')?.touched"
        >
        <div class="text-danger" *ngIf="editForm.get('name')?.invalid && editForm.get('name')?.touched">
          <small>Le nom est requis</small>
        </div>
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          formControlName="email"
          class="form-control"
          [class.is-invalid]="editForm.get('email')?.invalid && editForm.get('email')?.touched"
        >
        <div class="text-danger" *ngIf="editForm.get('email')?.invalid && editForm.get('email')?.touched">
          <small>Email invalide</small>
        </div>
      </div>

      <div class="form-group">
        <label for="password">Nouveau mot de passe (optionnel)</label>
        <input
          type="password"
          id="password"
          formControlName="password"
          class="form-control"
          placeholder="Laissez vide pour ne pas modifier"
        >
        <div class="text-danger" *ngIf="editForm.get('password')?.invalid && editForm.get('password')?.touched">
          <small>Minimum 6 caractères</small>
        </div>
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirmer le mot de passe</label>
        <input
          type="password"
          id="confirmPassword"
          formControlName="confirmPassword"
          class="form-control"
        >
        <div class="text-danger" *ngIf="editForm.errors?.['mismatch'] && editForm.get('confirmPassword')?.touched">
          <small>Les mots de passe ne correspondent pas</small>
        </div>
      </div>

      <div class="button-group">
        <button type="submit" class="btn-primary" [disabled]="editForm.invalid || loading">
          <span *ngIf="!loading">Sauvegarder</span>
          <span *ngIf="loading">Sauvegarde en cours...</span>
        </button>
        <button type="button" class="btn-secondary" (click)="cancel()" [disabled]="loading">
          Annuler
        </button>
      </div>

    </form>
  </div>
</div>
